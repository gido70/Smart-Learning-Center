name: Validate pull request

"on":
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run smoke test
        run: python tests/smoke_test.py

      - name: Test live session controls
        run: node tests/live_session_controls_test.js

      - name: Check release
        run: python scripts/check_release.py
